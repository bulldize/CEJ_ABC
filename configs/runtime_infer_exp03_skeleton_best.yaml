project:
  seed: 42
  device: auto

data:
  raw_dir: /Users/bulldize/cej_runtime/run_manual_inc_041055_001/raw_placeholder
  raw_layout: case_dirs
  images_tr_dir: null
  labels_tr_dir: null
  points_dir: null
  meta_dir: null
  max_cases: null
  processed_dir: /Users/bulldize/cej_runtime/run_sup_inc_041055_001/processed_manual_all_split
  output_dir: /Users/bulldize/cej_runtime/run_sup_inc_041055_001/outputs_exp03_skeleton_best
  raw_a_name: A.nii.gz
  raw_b_name: B.nii.gz
  raw_points_name: points.json
  raw_meta_name: meta.json
  processed_format: nii.gz
  use_tooth_mask_channel: true

preprocess:
  roi_padding_mm: 8.0
  target_spacing_mm:
    - 0.5
    - 0.5
    - 0.5
  resample_to_target: false
  intensity_clip_percentiles:
    - 1.0
    - 99.0
  intensity_norm: zscore
  dense_sample_step_mm: 0.2
  curve_closed: true
  curve_smooth: 0.0
  z_ignore_ratio: 0.1

model:
  checkpoint_path: /Users/bulldize/cej_runtime/run_sup_inc_041055_001/exp03_skeleton_aux_loss_training_bundle/outputs/train/checkpoints/best.pt
  in_channels: 2
  out_channels: 1
  base_channels: 16
  depth: 4
  num_res_units: 2
  norm: batch

infer:
  auto_runtime_preprocess: false
  force_runtime_preprocess: false
  threshold_theta: 0.3
  relative_threshold: 0.45
  fallback_min_threshold: 0.1
  min_component_voxels: 8
  max_curve_components: 4
  constrain_curve_to_tooth_mask: false
  constrain_curve_to_tooth_surface: false
  keep_lcc_for_curve: false
  fit_pred_curve: true
  fit_pred_curve_min_points: 8
  fit_pred_curve_min_closed_angle_coverage: 0.55
  use_prior_gating: false
  prior_sigma_z_mm: 2.0
  prior_sigma_s_mm: 1.0
  prior_delta_s_mm: 1.0
  prior_use_gradient: false
  prior_gradient_weight: 1.0
  use_sliding_window: false
  sw_roi_size: null
  sw_batch_size: 1
  sw_overlap: 0.25

eval:
  eval_taus_mm:
    - 0.5
    - 1.0
    - 1.5

viz:
  prediction_only: false
  enable_2d: false
  enable_3d: true
  num_slices: 4
  max_cases: 99
  max_teeth_per_case: 64
  max_render_dim: 96
  mesh_step: 1
  slice_opacity: 0.82
  tooth_opacity: 0.18
  heatmap_opacity: 0.35
  prior_opacity: 0.2
  heatmap_iso_threshold: 0.3
  pred_heatmap_iso_threshold: 0.3
  prior_iso_threshold: 0.5
  curve_max_points: 12000
  show_prior_3d: true
  use_error_colormap_for_gt_points: false
  color_tooth_surface: '#64B5F6'
  color_gt_heatmap: '#FFA726'
  color_pred_heatmap: '#FF5252'
  color_pred_curve: '#FF1744'
  color_dense_interp_curve: '#F500FF'
  color_pseudo_gt_skeleton: '#76FF03'
  color_gt_points: '#FFD600'
  color_prior: '#7E57C2'
  show_dense_interp_curve: true
  dense_interp_curve_closed: true
  dense_interp_curve_max_points: 20000
  show_pseudo_gt_skeleton: false
  pseudo_gt_skeleton_max_points: 12000
  split_summary_path: /Users/bulldize/cej_runtime/run_sup_inc_041055_001/exp03_skeleton_aux_loss_training_bundle/summary/split_summary_runtime.json
